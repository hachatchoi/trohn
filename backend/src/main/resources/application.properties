server.address=127.0.0.1
server.port=${API_PORT:18087}
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:33317/trohn?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USER:trohn_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=3000
spring.jackson.time-zone=UTC
server.error.include-message=never
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
