<text x="2678.0" y="2226.0" text-anchor="start" font-family="Arial" font-size="18.0" font-weight="400" fill="#263648">UC20 cần cùng giao dịch MySQL:</text>
<text x="2678.0" y="2249.4" text-anchor="start" font-family="Arial" font-size="18.0" font-weight="400" fill="#263648">khóa tài khoản + thu hồi phiên + hủy lịch + ẩn tin đang hiển thị của chủ trọ + nhật ký.</text>
<text x="2678.0" y="2272.8" text-anchor="start" font-family="Arial" font-size="18.0" font-weight="400" fill="#263648"></text>
<text x="2678.0" y="2296.2" text-anchor="start" font-family="Arial" font-size="18.0" font-weight="400" fill="#263648">UC21 chỉ mở khóa và ghi nhật ký.</text>
<text x="2678.0" y="2319.6" text-anchor="start" font-family="Arial" font-size="18.0" font-weight="400" fill="#263648"></text>
<text x="2678.0" y="2343.0" text-anchor="start" font-family="Arial" font-size="18.0" font-weight="400" fill="#263648">Không tự đăng ký Admin. Email chuẩn hóa duy nhất; mật khẩu chỉ lưu bản băm.</text>
<text x="2678.0" y="2366.4" text-anchor="start" font-family="Arial" font-size="18.0" font-weight="400" fill="#263648"></text>
<text x="2678.0" y="2389.8" text-anchor="start" font-family="Arial" font-size="18.0" font-weight="400" fill="#263648">Không khôi phục phiên cũ sau mở khóa.</text>
<rect x="80.0" y="2650.0" width="3650.0" height="100.0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
<text x="88.0" y="2676.0" text-anchor="start" font-family="Arial" font-size="18.0" font-weight="400" fill="#263648">ActorContext được backend tạo từ phiên hợp lệ/SecurityContext; client không được quyết định actorId hay vai trò.</text>
<text x="88.0" y="2699.4" text-anchor="start" font-family="Arial" font-size="18.0" font-weight="400" fill="#263648">Service kiểm tra trạng thái, quyền sở hữu và giao dịch. Controller nhận request/response; Repository thao tác Entity.</text>
<text x="88.0" y="2722.8" text-anchor="start" font-family="Arial" font-size="18.0" font-weight="400" fill="#263648">Các Repository lặp ở nhiều trang là cùng một interface, mỗi trang chỉ trình bày phần phương thức liên quan.</text>
