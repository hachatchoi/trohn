server {
    listen 80;
    root /usr/share/nginx/html;
    location /api/ {
        client_max_body_size 32m;
        proxy_pass http://api:18087;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
