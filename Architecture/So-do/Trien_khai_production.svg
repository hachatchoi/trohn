<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1260" viewBox="0 0 1400 1260">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#42566b" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="45" text-anchor="start" font-family="Arial" font-size="29" font-weight="700" fill="#17212b">TROHN — Phương án triển khai production</text>
<rect x="420" y="100" width="560" height="80" rx="8" fill="#dae8fc" stroke="#637e99" stroke-width="2"/>
<text x="700.0" y="148.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Người dùng trên trình duyệt</text>
<rect x="420" y="260" width="560" height="100" rx="8" fill="#e1d5e7" stroke="#637e99" stroke-width="2"/>
<text x="700.0" y="303.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Reverse proxy HTTPS</text>
<text x="700.0" y="334.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Tên miền và chứng chỉ cấu hình khi triển khai</text>
<rect x="40" y="470" width="460" height="95" rx="8" fill="#dae8fc" stroke="#637e99" stroke-width="2"/>
<text x="270.0" y="510.5" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Static build React</text>
<text x="270.0" y="541.5" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Đường dẫn /</text>
<rect x="800" y="470" width="550" height="105" rx="8" fill="#d5e8d4" stroke="#637e99" stroke-width="2"/>
<text x="1075.0" y="515.5" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Spring Boot</text>
<text x="1075.0" y="546.5" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">/api → cổng backend nội bộ</text>
<rect x="800" y="740" width="550" height="100" rx="8" fill="#dae8fc" stroke="#637e99" stroke-width="2"/>
<text x="1075.0" y="783.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">MySQL trong mạng riêng</text>
<text x="1075.0" y="814.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Không public cổng DB</text>
<rect x="40" y="740" width="460" height="100" rx="8" fill="#fff2cc" stroke="#637e99" stroke-width="2"/>
<text x="270.0" y="783.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Volume ảnh bền vững</text>
<text x="270.0" y="814.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Không public thư mục trực tiếp</text>
<rect x="420" y="1010" width="560" height="90" rx="8" fill="#eef2f6" stroke="#637e99" stroke-width="2"/>
<text x="700.0" y="1048.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Sao lưu DB + vùng ảnh</text>
<text x="700.0" y="1079.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Kiểm tra khôi phục ở môi trường riêng</text>
<polyline points="700,180 700,260" fill="none" stroke="#42566b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="755" y="225" text-anchor="middle" font-family="Arial" font-size="19" font-weight="400" fill="#17212b">HTTPS</text>
<polyline points="550,360 270,360 270,470" fill="none" stroke="#42566b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="330" y="395" text-anchor="middle" font-family="Arial" font-size="19" font-weight="400" fill="#17212b">/</text>
<polyline points="850,360 1075,360 1075,470" fill="none" stroke="#42566b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1140" y="410" text-anchor="middle" font-family="Arial" font-size="19" font-weight="400" fill="#17212b">/api</text>
<polyline points="1075,575 1075,740" fill="none" stroke="#42566b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1165" y="660" text-anchor="middle" font-family="Arial" font-size="19" font-weight="400" fill="#17212b">JDBC nội bộ</text>
<polyline points="800,525 650,525 650,790 500,790" fill="none" stroke="#42566b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="650" y="683" text-anchor="middle" font-family="Arial" font-size="19" font-weight="400" fill="#17212b">File I/O</text>
<polyline points="1075,840 1075,1055 980,1055" fill="none" stroke="#42566b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="270,840 270,1055 420,1055" fill="none" stroke="#42566b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="40" y="1170" text-anchor="start" font-family="Arial" font-size="20" font-weight="400" fill="#17212b">Một origin cho frontend và API; cookie Secure, HttpOnly, SameSite=Lax; bí mật ở cấu hình môi trường.</text>
<text x="40" y="1210" text-anchor="start" font-family="Arial" font-size="20" font-weight="400" fill="#17212b">Ảnh chỉ được đọc qua API kiểm quyền. Phương án một backend; chưa có CI/CD hoặc hosting đã xác nhận.</text>
</svg>