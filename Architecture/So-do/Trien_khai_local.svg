<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#42566b" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="45" text-anchor="start" font-family="Arial" font-size="29" font-weight="700" fill="#17212b">TROHN — Môi trường phát triển và kiểm thử đề xuất</text>
<rect x="70" y="120" width="480" height="130" rx="8" fill="#dae8fc" stroke="#637e99" stroke-width="2"/>
<text x="310.0" y="163.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Trình duyệt + Vite dev server</text>
<text x="310.0" y="194.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">http://127.0.0.1:5173</text>
<text x="310.0" y="225.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Giao diện demo hiện có</text>
<rect x="800" y="120" width="520" height="130" rx="8" fill="#d5e8d4" stroke="#637e99" stroke-width="2"/>
<text x="1060.0" y="163.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Spring Boot</text>
<text x="1060.0" y="194.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">http://127.0.0.1:8080</text>
<text x="1060.0" y="225.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Backend cần triển khai</text>
<rect x="800" y="410" width="520" height="115" rx="8" fill="#dae8fc" stroke="#637e99" stroke-width="2"/>
<text x="1060.0" y="460.5" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">MySQL / InnoDB</text>
<text x="1060.0" y="491.5" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">127.0.0.1:3306</text>
<rect x="70" y="410" width="480" height="115" rx="8" fill="#fff2cc" stroke="#637e99" stroke-width="2"/>
<text x="310.0" y="460.5" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Vùng ảnh trên máy phát triển</text>
<text x="310.0" y="491.5" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Nằm ngoài web root</text>
<rect x="70" y="660" width="480" height="115" rx="8" fill="#e1d5e7" stroke="#637e99" stroke-width="2"/>
<text x="310.0" y="710.5" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Postman / công cụ kiểm thử</text>
<text x="310.0" y="741.5" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Cookie phiên + Origin + CSRF</text>
<polyline points="550,180 800,180" fill="none" stroke="#42566b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="675" y="159" text-anchor="middle" font-family="Arial" font-size="19" font-weight="400" fill="#17212b">HTTP /api/v1</text>
<polyline points="1060,250 1060,410" fill="none" stroke="#42566b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1100" y="335" text-anchor="middle" font-family="Arial" font-size="19" font-weight="400" fill="#17212b">JDBC</text>
<polyline points="800,225 650,225 650,467 550,467" fill="none" stroke="#42566b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="650" y="365" text-anchor="middle" font-family="Arial" font-size="19" font-weight="400" fill="#17212b">File I/O</text>
<polyline points="550,717 700,717 700,280 1060,280 1060,250" fill="none" stroke="#42566b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="40" y="850" text-anchor="start" font-family="Arial" font-size="20" font-weight="400" fill="#17212b">Dùng thống nhất origin 127.0.0.1:5173; CORS allow đúng origin, gửi credentials.</text>
<text x="40" y="890" text-anchor="start" font-family="Arial" font-size="20" font-weight="400" fill="#17212b">MySQL và phpMyAdmin có cấu hình Compose; chưa coi đó là backend hoặc kết quả SQL đã chạy.</text>
<text x="40" y="930" text-anchor="start" font-family="Arial" font-size="20" font-weight="400" fill="#17212b">Chỉ kiểm thử Postman thật sau khi backend chạy và kết nối DB; không gửi request vào production.</text>
</svg>