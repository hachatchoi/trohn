<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1300" viewBox="0 0 1400 1300">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#42566b" stroke-width="1.5"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="45" text-anchor="start" font-family="Arial" font-size="29" font-weight="700" fill="#17212b">TROHN — Kiến trúc tổng thể đề xuất</text>
<rect x="350" y="90" width="700" height="70" rx="8" fill="#eef2f6" stroke="#637e99" stroke-width="2"/>
<text x="700.0" y="133.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Khách thuê  |  Chủ trọ  |  Quản trị viên</text>
<rect x="350" y="210" width="700" height="95" rx="8" fill="#dae8fc" stroke="#637e99" stroke-width="2"/>
<text x="700.0" y="250.5" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Trình duyệt: React + TypeScript</text>
<text x="700.0" y="281.5" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Form, danh sách, bản đồ Leaflet</text>
<rect x="350" y="365" width="700" height="100" rx="8" fill="#f8cecc" stroke="#637e99" stroke-width="2"/>
<text x="700.0" y="408.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Spring Security</text>
<text x="700.0" y="439.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Phiên MySQL · vai trò · Origin / CSRF</text>
<rect x="350" y="520" width="700" height="80" rx="8" fill="#e1d5e7" stroke="#637e99" stroke-width="2"/>
<text x="700.0" y="568.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Controller: HTTP và Request / Response DTO</text>
<rect x="350" y="660" width="700" height="110" rx="8" fill="#d5e8d4" stroke="#637e99" stroke-width="2"/>
<text x="700.0" y="708.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Service: nghiệp vụ và quyền sở hữu</text>
<text x="700.0" y="739.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Ranh giới transaction cho thao tác nhiều bảng</text>
<rect x="350" y="840" width="700" height="85" rx="8" fill="#fff2cc" stroke="#637e99" stroke-width="2"/>
<text x="700.0" y="890.5" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Repository / JPA: truy vấn, khóa và lưu dữ liệu</text>
<rect x="350" y="995" width="700" height="90" rx="8" fill="#dae8fc" stroke="#637e99" stroke-width="2"/>
<text x="700.0" y="1033.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">MySQL / InnoDB</text>
<text x="700.0" y="1064.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">12 bảng gồm dữ liệu nghiệp vụ và phiên</text>
<rect x="35" y="660" width="260" height="110" rx="8" fill="#fff2cc" stroke="#637e99" stroke-width="2"/>
<text x="165.0" y="708.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">ImageStorage</text>
<text x="165.0" y="739.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Ảnh ngoài web root</text>
<rect x="1105" y="660" width="260" height="110" rx="8" fill="#fff2cc" stroke="#637e99" stroke-width="2"/>
<text x="1235.0" y="708.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">GeoService</text>
<text x="1235.0" y="739.0" text-anchor="middle" font-family="Arial" font-size="23" font-weight="400" fill="#17212b">Khoảng cách tới cơ sở</text>
<polyline points="700,160 700,210" fill="none" stroke="#42566b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="700,305 700,365" fill="none" stroke="#42566b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="700" y="343" text-anchor="middle" font-family="Arial" font-size="19" font-weight="400" fill="#17212b">HTTPS / JSON / multipart</text>
<polyline points="700,465 700,520" fill="none" stroke="#42566b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="700" y="499" text-anchor="middle" font-family="Arial" font-size="19" font-weight="400" fill="#17212b">ActorContext từ phiên hợp lệ</text>
<polyline points="700,600 700,660" fill="none" stroke="#42566b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="700" y="637" text-anchor="middle" font-family="Arial" font-size="19" font-weight="400" fill="#17212b">Gọi phương thức nghiệp vụ</text>
<polyline points="700,770 700,840" fill="none" stroke="#42566b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="700" y="812" text-anchor="middle" font-family="Arial" font-size="19" font-weight="400" fill="#17212b">Entity và truy vấn</text>
<polyline points="700,925 700,995" fill="none" stroke="#42566b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="700" y="967" text-anchor="middle" font-family="Arial" font-size="19" font-weight="400" fill="#17212b">SQL / JDBC</text>
<polyline points="350,715 295,715" fill="none" stroke="#42566b" stroke-width="2.2" marker-end="url(#arrow)"/>
<polyline points="1050,715 1105,715" fill="none" stroke="#42566b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="40" y="1140" text-anchor="start" font-family="Arial" font-size="20" font-weight="400" fill="#17212b">Các module: tài khoản / phiên, tin đăng, yêu thích, lịch hẹn, danh mục, quản trị.</text>
<text x="40" y="1180" text-anchor="start" font-family="Arial" font-size="20" font-weight="400" fill="#17212b">Security tra phiên và tài khoản qua Repository; Service kiểm lại trước khi ghi.</text>
<text x="40" y="1220" text-anchor="start" font-family="Arial" font-size="20" font-weight="400" fill="#17212b">ImageStorage không nằm trong transaction DB; GeoService tính tại backend, không phải API chỉ đường.</text>
<text x="40" y="1260" text-anchor="start" font-family="Arial" font-size="20" font-weight="400" fill="#17212b">Giao diện đã có bản demo. Các thành phần backend trong hình là thiết kế cần triển khai.</text>
</svg>